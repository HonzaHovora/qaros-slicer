name: Windows native build
on:
  workflow_dispatch:
  push:
    paths:
      - 'apps/**'
      - 'src/**'
      - 'include/**'
      - 'CMakeLists.txt'
      - 'vcpkg.json'
      - '.github/workflows/windows-native.yml'
permissions:
  contents: read
jobs:
  windows-native:
    runs-on: windows-2022
    timeout-minutes: 60
    env:
      VCPKG_BINARY_SOURCES: 'clear;files,C:\vcpkg-cache,readwrite'
    steps:
      - uses: actions/checkout@v4
      - name: Fetch the manifest baseline into the runner's vcpkg checkout
        shell: pwsh
        run: |
          git -C "$env:VCPKG_INSTALLATION_ROOT" fetch --depth=1 origin 0699a19d0c6386247ce50d4dedbb8217d484d536
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          New-Item -ItemType Directory -Force C:/vcpkg-cache | Out-Null
      - uses: actions/cache@v4
        with:
          path: C:\vcpkg-cache
          key: windows-vcpkg-${{ hashFiles('vcpkg.json') }}
      - name: Fetch pinned public SDK header (compile only)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force sdk/include | Out-Null
          Invoke-WebRequest https://raw.githubusercontent.com/Quaternar/qaros/678e5463bb14a9d4d1f681fcdb9dfab9fe61e77e/qar-streaming-c/include/qar_streaming.h -OutFile sdk/include/qar_streaming.h
      - name: Configure with vcpkg
        shell: pwsh
        run: |
          cmake -S . -B build-windows -G "Visual Studio 17 2022" -A x64 "-DCMAKE_TOOLCHAIN_FILE=$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" -DVCPKG_TARGET_TRIPLET=x64-windows -DQARVTK_BUILD_SENDER=ON "-DQAROS_SDK_ROOT=$env:GITHUB_WORKSPACE/sdk"
      - name: Compile renderer, preview and sender
        run: cmake --build build-windows --config Release --parallel 4
      - name: Core tests and SDK fingerprint (runner has no supported XR GPU)
        shell: pwsh
        run: |
          ctest --test-dir build-windows -C Release -R '^core$' --output-on-failure
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./build-windows/Release/qarvtk-sender.exe --sdk-info
      - uses: actions/upload-artifact@v4
        with:
          name: windows-preview-and-sender-no-qaros-runtime
          path: |
            build-windows/Release/*.exe
            build-windows/Release/*.dll
            build-windows/qarvtk-sdk.json
          retention-days: 14
